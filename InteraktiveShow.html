
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interaktive Show | WAS SCHAUST DU DA??</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;
}

h1 {
    font-size: clamp(27px, 5vw, 42px);
    margin-bottom: 12px;
}

p {
    color: #bdbdbd;
    font-size: 17px;
    margin-bottom: 35px;
}

#qrcode {
    background: white;
    padding: 15px;
    border-radius: 8px;
    display: inline-block;
}

.back {
    margin-top: 35px;
    color: #ff3865;
    text-decoration: none;
    font-weight: bold;
}

.back:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<h1>Die Show hat noch nicht begonnen!</h1>

<p>Scanne den QR-Code, um fortzufahren.</p>

<div id="qrcode"></div>

<a class="back" href="index.html">Zurück zur Startseite</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
const errorUrl = new URL("Error.html", window.location.href).href;

new QRCode(document.getElementById("qrcode"), {
    text: errorUrl,
    width: 220,
    height: 220,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
});
</script>

</body>
</html>
